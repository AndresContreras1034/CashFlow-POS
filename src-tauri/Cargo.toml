[package]
name = "pos"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ==========================================
# Base de datos
# ==========================================

sqlx = {
    version = "0.8",
    features = [
        "postgres",
        "runtime-tokio",
        "macros",
        "migrate",
        "chrono",
        "uuid",
        "json"
    ]
}

tokio = { version = "1", features = ["full"] }

# ==========================================
# Utilidades
# ==========================================

chrono = { version = "0.4", features = ["serde"] }

uuid = {
    version = "1",
    features = ["v4", "serde"]
}

thiserror = "1"
anyhow = "1"

rust_decimal = {
    version = "1",
    features = ["serde-with-str"]
}
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }

# ==========================================
# Configuración
# ==========================================

dotenvy = "0.15"
url = "2"
percent-encoding = "2"

# ==========================================
# Logging
# ==========================================

tracing = "0.1"

tracing-subscriber = {
    version = "0.3",
    features = ["env-filter"]
}

# ==========================================
# Excel / Importación masiva
# ==========================================

calamine = "0.26"

# ==========================================
# Logo / imágenes para ESC/POS
# ==========================================
#
# Se utiliza únicamente para leer el JPG del
# logo y convertirlo a bitmap monocromático.
#

image = {
    version = "0.25",
    default-features = false,
    features = ["jpeg"]
}
rust_xlsxwriter = "0.99.1"

# ==========================================
# Backup: Cifrado, credenciales y SMTP
# ==========================================
aes-gcm = { version = "0.10", features = ["stream"] }
argon2 = "0.5"
zeroize = "1"
keyring = { version = "3", features = ["windows-native"] }
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }

# ==========================================
# Impresión térmica ESC/POS
# Windows Spooler
# ==========================================

[target.'cfg(windows)'.dependencies]

winapi = {
    version = "0.3",
features = [
    "winspool",
    "winnt",
    "minwindef",
    "handleapi",
    "errhandlingapi",
    "consoleapi",
    "processenv",
    "winbase",
    "wincon",
    "winuser"
]
}

[profile.dev.package."*"]
opt-level = 3
